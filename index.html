<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<meta name="description" content="经典扫雷小游戏：初级 9×9、中级 16×16、高级 30×16，轻点/左键翻开、长按/右键插旗，首次点击不会踩雷。">
<meta name="theme-color" content="#141c2e">
<meta name="author" content="Zhong-xh">

<!-- 浏览器标签页图标 -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="og-image.png">

<!-- 微信 / QQ / 社交平台分享卡片 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="扫雷">
<meta property="og:title" content="扫雷">
<meta property="og:description" content="经典扫雷小游戏，三档难度，点开即玩。">
<meta property="og:url" content="https://zhong-xh.github.io/minesweeper/">
<meta property="og:image" content="https://zhong-xh.github.io/minesweeper/og-image.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:locale" content="zh_CN">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="扫雷">
<meta name="twitter:description" content="经典扫雷小游戏，三档难度，点开即玩。">
<meta name="twitter:image" content="https://zhong-xh.github.io/minesweeper/og-image.png">

<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>扫雷</h1>
    <div class="toolbar">
      <div class="difficulty">
        <button data-level="beginner" class="active">初级 9×9</button>
        <button data-level="intermediate">中级 16×16</button>
        <button data-level="expert">高级 30×16</button>
      </div>
      <button id="restart" class="restart">🔄 重新开始</button>
    </div>
    <div class="status">
      <div class="stat"><span class="icon">🚩</span><span id="mine-count">0 / 10</span></div>
      <div class="stat"><span class="icon">⏱</span><span id="timer">000</span></div>
    </div>
    <div class="board-area">
      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>
    </div>
    <div id="message" class="message"></div>
    <p class="hint">轻点翻开 · 手机长按插旗 · 电脑右键插旗 · 双指缩放</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
